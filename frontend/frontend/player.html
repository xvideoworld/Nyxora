<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nyxora — Player</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="player-page standalone" id="playerPage">
  <div class="player-header">
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
    <div class="player-header-actions">
      <button onclick="shareVideo()"><i class="fas fa-share-alt"></i></button>
      <button class="download-btn" onclick="downloadVideo()"><i class="fas fa-download"></i> Download</button>
    </div>
  </div>
  <div class="video-container">
    <video id="playerVideo" controls autoplay playsinline></video>
  </div>
  <div class="video-info-section">
    <h1 class="player-title" id="playerTitle">Loading...</h1>
    <div class="player-stats" id="playerStats">
      <span class="stat-item"><i class="fas fa-eye"></i> <span id="statViews">0</span></span>
      <span class="stat-item"><i class="fas fa-thumbs-up"></i> <span id="statLikes">0</span></span>
      <span class="stat-item"><i class="fas fa-comment"></i> <span id="statComments">0</span></span>
      <span class="stat-item"><i class="fas fa-clock"></i> <span id="statDuration">0:00</span></span>
      <span class="stat-item"><i class="fas fa-calendar"></i> <span id="statPublished">Recently</span></span>
    </div>
    <div class="player-actions-row">
      <button class="action-btn" id="likeBtn" onclick="toggleLike()"><i class="fas fa-thumbs-up"></i> Like</button>
      <button class="action-btn" onclick="shareVideo()"><i class="fas fa-share-alt"></i> Share</button>
      <button class="action-btn" onclick="downloadVideo()"><i class="fas fa-download"></i> Download</button>
    </div>
    <div class="player-author-row">
      <div class="author-avatar" id="authorAvatar"><i class="fas fa-user"></i></div>
      <div class="author-info">
        <h3 id="authorName">Author</h3>
        <p id="authorSubs">Creator</p>
      </div>
      <button class="subscribe-btn">Subscribe</button>
    </div>
    <div class="player-description">
      <h4>Description</h4>
      <p id="videoDescription">Loading...</p>
    </div>
  </div>
  <div class="comments-section">
    <div class="comments-header">
      <h3>Comments <span id="commentCount">(0)</span></h3>
    </div>
    <div id="commentsList"><div class="loading-spinner"><div class="spinner"></div></div></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/player.js"></script>
</body>  
</html>
