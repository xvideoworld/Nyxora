/* Same CSS as before — keeping only essential neumorphic styles */
:root{
  --bg:#eaedf4;--sur:#f0f3fa;--glass:rgba(255,255,255,0.82);

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);font-family:'Plus Jakarta Sans',sans-serif;color:var(--txt);}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-thumb{background:var(--sd);border-radius:3px;}
.page{display:none;height:calc(100vh - 65px);overflow-y:auto;}
.page.active{display:block;}
#pg-login{display:none;height:100vh;}
#pg-login.active{display:block;}
svg.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;}
svg.ic-sm{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;}

.bn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:6px 0;border:none;background:transparent;font-family:'Plus Jakarta Sans',sans-serif;font-size:10px;font-weight:700;color:var(--txt2);}
.bn.active{color:var(--red);}
.bn.active svg{stroke:var(--red);}
.hdr{position:sticky;top:0;z-index:100;background:var(--glass);backdrop-filter:blur(28px);border-bottom:1.5px solid rgba(255,255,255,0.85);padding:14px 18px;}
.hdr-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.hdr-logo{font-size:24px;font-weight:900;background:linear-gradient(135deg,#ff2020 0%,#ff6060 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

.icon-btn:active{box-shadow:var(--neu-in);transform:translateY(2px);}
