<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0f111a;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Розовое свечение снизу */
        .bg-glow {
            position: fixed;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 600px;
            height: 350px;
            background: radial-gradient(circle, rgba(255, 20, 147, 0.25) 0%, rgba(0,0,0,0) 70%);
            filter: blur(40px);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Секция логотипа */
        .main-header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px 0;
            margin-bottom: 15px;
        }

        .logo-container {
            text-align: center;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 60px;
        }

        .site-logo {
            max-height: 60px;
            max-width: 100%;
            object-fit: contain;
            display: block;
        }

        /* Прозрачный стеклянный блок (Glassmorphism) */
        .welcome-box {
            background: rgba(255, 255, 255, 0.06); 
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            margin-bottom: 25px;
        }

        .welcome-box h1 {
            font-size: 28px;
            margin-bottom: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .welcome-box p {
            font-size: 14px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.85);
        }

        /* Поисковая строка */
        .search-container {
            margin-bottom: 20px;
        }

        .search-container input {
            width: 100%;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }

        .search-container input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Вкладки категорий */
        .category-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ccc;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .tab-btn.active, .tab-btn:hover {
            background: #00e676;
            color: #000;
            font-weight: 600;
            border-color: #00e676;
        }

        /* Заголовки автоматических секций */
        .section-title {
            font-size: 18px;
            margin: 25px 0 12px 5px;
            color: #00f2fe;
            letter-spacing: 0.5px;
        }

        /* Карточки приложений */
        .app-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 18px;
            padding: 15px;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .app-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .app-icon {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            object-fit: cover;
            background: #202330;
        }

        .app-details h3 {
            font-size: 16px;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .app-details p {
            font-size: 12px;
            color: #b3b3b3;
        }

        /* Кнопка скачивания */
        .download-btn {
            background: #00e676;
            color: #000;
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.2s;
        }

        .download-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.4);
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="container">
        <header class="main-header">
            <div class="logo-container" id="logo-box">
                <img src="logo.png" alt="Logo" class="site-logo" id="main-logo">
            </div>
        </header>

        <section class="welcome-box">
            <h1>Добро пожаловать</h1>
            <p>Вы можете скачать все необходимое с этого сайта и свободно использовать в своих видео без проблем с авторскими правами. Исследуйте премиальные визуальные эффекты, кинематографические фоны, эстетичные клипы и высококачественный контент.</p>
        </section>

        <div class="search-container">
            <input type="text" id="search-input" placeholder="Поиск приложений...">
        </div>

        <div class="category-tabs">
            <button class="tab-btn active" data-category="all">Все</button>
            <button class="tab-btn" data-category="editors">Редакторы</button>
            <button class="tab-btn" data-category="tools">Инструменты</button>
            <button class="tab-btn" data-category="games">Игры</button>
        </div>

        <div id="items-wrapper"></div>
    </div>

    <script>
        // Автоматическая проверка расширения логотипа (png, jpg, jpeg) для точного отображения
        const mainLogo = document.getElementById('main-logo');
        const logoExtensions = ['logo.png', 'logo.jpg', 'logo.jpeg', 'Logo.png', 'Logo.jpg'];
        let currentExtIndex = 0;

        mainLogo.onerror = function() {
            currentExtIndex++;
            if (currentExtIndex < logoExtensions.length) {
                this.src = logoExtensions[currentExtIndex];
            }
        };

        // Данные 31 приложения на русском языке
        const appData = [
            { name: "Picsart Pro", type: "editors", desc: "AI фото и видео редактор", icon: "picsart.png", link: "https://t.me/videoworld82/2" },
            { name: "CapCut Pro", type: "editors", desc: "Профессиональный видеоредактор", icon: "capcut.png", link: "https://t.me/videoworld82/3" },
            { name: "Meitu Pro", type: "editors", desc: "AI ретушь фото и коллажи", icon: "meitu.png", link: "https://t.me/videoworld82/4" },
            { name: "TeraBox Premium", type: "tools", desc: "Облачное хранилище", icon: "terabox.png", link: "https://t.me/videoworld82/5" },
            { name: "Hypic Pro", type: "editors", desc: "AI инструмент для редактирования", icon: "hypic.png", link: "https://t.me/videoworld82/6" },
            { name: "Lightroom Pro", type: "editors", desc: "Премиум фоторедактор и пресеты", icon: "lightroom.png", link: "https://t.me/videoworld82/7" },
            { name: "InShot Pro", type: "editors", desc: "Редактор видео и создание клипов", icon: "inshot.png", link: "https://t.me/videoworld82/8" },
            { name: "Kinemaster Pro", type: "editors", desc: "Продвинутый видеомонтаж", icon: "kinemaster.png", link: "https://t.me/videoworld82/9" },
            { name: "VivaCut Pro", type: "editors", desc: "Видеоредактор с эффектами VFX", icon: "vivacut.png", link: "https://t.me/videoworld82/10" },
            { name: "Alight Motion Pro", type: "editors", desc: "Анимация и моушн-дизайн", icon: "alightmotion.png", link: "https://t.me/videoworld82/11" },
            { name: "PowerDirector Pro", type: "editors", desc: "Редактирование видео в 4K", icon: "powerdirector.png", link: "https://t.me/videoworld82/12" },
            { name: "Remini Pro", type: "editors", desc: "AI улучшение качества фото", icon: "remini.png", link: "https://t.me/videoworld82/13" },
            { name: "PixelLab Pro", type: "editors", desc: "Текст на фото и графический дизайн", icon: "pixellab.png", link: "https://t.me/videoworld82/14" },
            { name: "Canva Pro", type: "editors", desc: "Графический дизайн и шаблоны", icon: "canva.png", link: "https://t.me/videoworld82/15" },
            { name: "Snapseed Plus", type: "editors", desc: "Профессиональный фоторедактор", icon: "snapseed.png", link: "https://t.me/videoworld82/16" },
            { name: "VN Video Editor Pro", type: "editors", desc: "Удобный видеоредактор для влогов", icon: "vn.png", link: "https://t.me/videoworld82/17" },
            { name: "Node Video Pro", type: "editors", desc: "Мощный мобильный видеоредактор", icon: "nodevideo.png", link: "https://t.me/videoworld82/18" },
            { name: "FilmoraGo Pro", type: "editors", desc: "Видеоредактор и создание фильмов", icon: "filmora.png", link: "https://t.me/videoworld82/19" },
            { name: "PicsKit Pro", type: "editors", desc: "Многослойный фоторедактор", icon: "picskit.png", link: "https://t.me/videoworld82/20" },
            { name: "PhotoRoom Pro", type: "editors", desc: "AI удаление фона и замена картинок", icon: "photoroom.png", link: "https://t.me/videoworld82/21" },
            { name: "Wink Pro", type: "editors", desc: "Ретушь видео и улучшение качества", icon: "wink.png", link: "https://t.me/videoworld82/22" },
            { name: "ZArchiver Pro", type: "tools", desc: "Управление архивами и файлами", icon: "zarchiver.png", link: "https://t.me/videoworld82/23" },
            { name: "MT Manager VIP", type: "tools", desc: "Мощный файловый менеджер и APK редактор", icon: "mtmanager.png", link: "https://t.me/videoworld82/24" },
            { name: "VPN Master Pro", type: "tools", desc: "Безопасный и быстрый прокси VPN", icon: "vpnmaster.png", link: "https://t.me/videoworld82/25" },
            { name: "CapCut Template Pro", type: "tools", desc: "Премиум шаблоны для видео", icon: "cctemplate.png", link: "https://t.me/videoworld82/26" },
            { name: "Subway Surfers Mod", type: "games", desc: "Аркада с бесконечными монетами", icon: "subwaysurfers.png", link: "https://t.me/videoworld82/27" },
            { name: "Vector Premium", type: "games", desc: "Экшн-игра в стиле паркур", icon: "vector.png", link: "https://t.me/videoworld82/28" },
            { name: "Minecraft Pocket Edition", type: "games", desc: "Премиум песочница и крафтинг", icon: "minecraft.png", link: "https://t.me/videoworld82/29" },
            { name: "Grand Theft Auto San Andreas", type: "games", desc: "Экшн-приключение в открытом мире", icon: "gtasa.png", link: "https://t.me/videoworld82/30" },
            { name: "PPSSPP Gold", type: "tools", desc: "Премиум эмулятор PSP для Android", icon: "ppsspp.png", link: "https://t.me/videoworld82/31" },
            { name: "Hill Climb Racing Mod", type: "games", desc: "Гонки с бесконечными деньгами", icon: "hillclimb.png", link: "https://t.me/videoworld82/32" }
        ];

        const itemsWrapper = document.getElementById('items-wrapper');
        const tabButtons = document.querySelectorAll('.tab-btn');
        const searchInput = document.getElementById('search-input');

        function renderItems(filterCategory = 'all', searchTerm = '') {
            itemsWrapper.innerHTML = ''; 

            const filteredData = appData.filter(item => {
                const matchesCategory = filterCategory === 'all' || item.type === filterCategory;
                const matchesSearch = item.name.toLowerCase().includes(searchTerm.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            const sections = {};
            filteredData.forEach(item => {
                if (!sections[item.type]) {
                    sections[item.type] = [];
                }
                sections[item.type].push(item);
            });

            for (const category in sections) {
                const sectionHeader = document.createElement('h2');
                sectionHeader.className = 'section-title';
                
                if(category === 'editors') sectionHeader.innerText = "Инструменты редактирования";
                else if(category === 'tools') sectionHeader.innerText = "Полезные инструменты";
                else if(category === 'games') sectionHeader.innerText = "Популярные игры";

                itemsWrapper.appendChild(sectionHeader);

                sections[category].forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'app-card';
                    card.innerHTML = `
                        <div class="app-info">
                            <img src="${item.icon}" alt="${item.name}" class="app-icon" onerror="this.src='https://via.placeholder.com/52';">
                            <div class="app-details">
                                <h3>${item.name}</h3>
                                <p>${item.desc}</p>
                            </div>
                        </div>
                        <a href="${item.link}" class="download-btn" target="_blank">Скачать</a>
                    `;
                    itemsWrapper.appendChild(card);
                });
            }
        }

        tabButtons.forEach(button => {
            button.addEventListener('click', () => {
                tabButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                renderItems(button.dataset.category, searchInput.value);
            });
        });

        searchInput.addEventListener('input', () => {
            const activeTab = document.querySelector('.tab-btn.active').dataset.category;
            renderItems(activeTab, searchInput.value);
        });

        renderItems();
    </script>
</body>
</html>
