<style>
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }

body {
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:#ffffff;
  color:#111;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-track { background:#f5f5f5; }
::-webkit-scrollbar-thumb { background:#ddd; border-radius:8px; }

button { font-family:inherit; cursor:pointer; border:none; outline:none; background:none; color:inherit; }
input { font-family:inherit; outline:none; border:none; background:none; color:inherit; }
a { color:inherit; text-decoration:none; }

:root {
  --red: #e63946;
  --red-hover: #c92a35;
  --red-soft: rgba(230,57,70,0.08);
  --text: #111;
  --text-soft: #555;
  --text-mute: #aaa;
  --border: #eee;
  --border-light: #f2f2f2;
  --card: #fff;
  --shadow: 0 1px 12px rgba(0,0,0,0.04);
  --shadow-hover: 0 8px 32px rgba(0,0,0,0.07);
  --radius: 12px;
  --header-h: 64px;
}

@keyframes fadeUp {
  from { opacity:0; transform:translateY(20px); }
  to { opacity:1; transform:translateY(0); }
}

@keyframes fadeIn {
  from { opacity:0; }
  to { opacity:1; }
}

/* ─── HEADER ─── */
.header {
  position:fixed; top:0; left:0; right:0; z-index:1000;
  height:var(--header-h);
  background:rgba(255,255,255,0.92);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center;
  padding:0 20px;
}

.header-inner {
  max-width:1000px; width:100%; margin:0 auto;
  display:flex; align-items:center; gap:16px;
}

.profile-mini {
  display:flex; align-items:center; gap:12px;
  animation:fadeUp 0.5s ease;
}

.profile-mini .av {
  width:40px; height:40px; border-radius:50%;
  background:linear-gradient(135deg,#f09433,#bc1888);
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:15px; font-weight:700;
}

.profile-mini .info h2 {
  font-size:16px; font-weight:700;
}

.profile-mini .info p {
  font-size:12px; color:var(--text-mute);
}

.search-inline {
  flex:1; max-width:320px; position:relative;
}

.search-inline input {
  width:100%; padding:9px 40px 9px 16px;
  background:#f7f7f7;
  border:1.5px solid transparent;
  border-radius:100px;
  font-size:13px;
  transition:all 0.3s ease;
}

.search-inline input:focus {
  border-color:var(--red);
  background:#fff;
  box-shadow:0 0 0 4px var(--red-soft);
}

.search-inline button {
  position:absolute; right:4px; top:50%;
  transform:translateY(-50%);
  width:32px; height:32px; border-radius:50%;
  background:var(--red); color:#fff; font-size:12px;
}

.head-acts { display:flex; gap:6px; }
.h-btn {
  width:36px; height:36px; border-radius:50%;
  background:#f7f7f7; color:var(--text-soft);
  display:flex; align-items:center; justify-content:center;
  font-size:15px; transition:all 0.3s ease;
}
.h-btn:hover { background:#eee; color:var(--text); }

/* ─── PROFILE HERO ─── */
.profile-hero {
  margin-top:calc(var(--header-h) + 16px);
  max-width:1000px; margin-left:auto; margin-right:auto;
  padding:0 20px 16px;
  animation:fadeUp 0.6s ease;
}

.profile-card {
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  padding:24px;
  display:flex; align-items:center; gap:20px;
}

.profile-card .avatar {
  width:72px; height:72px; border-radius:50%;
  background:linear-gradient(135deg,#f09433,#bc1888);
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:28px; font-weight:800;
  flex-shrink:0;
}

.profile-card .details h1 {
  font-size:22px; font-weight:900;
  margin-bottom:2px;
}

.profile-card .details .handle {
  font-size:14px; color:var(--text-mute);
  margin-bottom:6px;
}

.profile-card .details .bio {
  font-size:13px; color:var(--text-soft);
  margin-bottom:10px;
  line-height:1.4;
}

.profile-card .stats {
  display:flex; gap:24px;
}

.profile-card .stats span {
  font-size:13px; color:var(--text-soft);
}

.profile-card .stats span strong {
  color:var(--text); font-weight:700;
}

/* ─── FILTER BAR ─── */
.filter-bar {
  max-width:1000px; margin:0 auto;
  padding:0 20px 12px;
  display:flex; gap:6px;
  animation:fadeUp 0.7s ease;
}

.filter-pill {
  padding:7px 18px; border-radius:100px;
  background:#f7f7f7; color:var(--text-soft);
  font-size:12px; font-weight:500;
  transition:all 0.3s ease;
  border:1px solid transparent;
}

.filter-pill:hover { background:#eee; }
.filter-pill.active { background:var(--red); color:#fff; border-color:var(--red); }

/* ─── MAIN GRID ─── */
.main {
  max-width:1000px; margin:0 auto;
  padding:0 20px 60px;
}

.grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

@media (max-width:820px) { .grid { grid-template-columns:repeat(2,1fr); } }
@media (max-width:480px) { .grid { grid-template-columns:1fr; } }

/* ─── VIDEO CARD ─── */
.vid-card {
  background:#fff;
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  transition:all 0.4s cubic-bezier(0.16,1,0.3,1);
  cursor:pointer;
  animation:fadeUp 0.5s ease both;
}

.vid-card:nth-child(1) { animation-delay:0.00s; }
.vid-card:nth-child(2) { animation-delay:0.04s; }
.vid-card:nth-child(3) { animation-delay:0.08s; }
.vid-card:nth-child(4) { animation-delay:0.12s; }
.vid-card:nth-child(5) { animation-delay:0.16s; }
.vid-card:nth-child(6) { animation-delay:0.20s; }
.vid-card:nth-child(7) { animation-delay:0.24s; }
.vid-card:nth-child(8) { animation-delay:0.28s; }
.vid-card:nth-child(9) { animation-delay:0.32s; }

.vid-card:hover {
  transform:translateY(-4px);
  box-shadow:var(--shadow-hover);
  border-color:#ddd;
}

.vid-card:active { transform:scale(0.97); }

.vid-media {
  position:relative; width:100%;
  aspect-ratio:9/16;
  background:#f7f7f7;
  overflow:hidden;
}

.vid-media video,
.vid-media img {
  width:100%; height:100%;
  object-fit:cover;
  transition:transform 0.6s ease;
}

.vid-card:hover .vid-media img { transform:scale(1.04); }

.vid-media .play-badge {
  position:absolute; bottom:8px; left:8px;
  background:rgba(0,0,0,0.8);
  color:#fff; padding:3px 8px; border-radius:6px;
  font-size:10px; font-weight:600;
  display:flex; align-items:center; gap:4px;
}

.vid-media .like-badge {
  position:absolute; bottom:8px; right:8px;
  background:rgba(0,0,0,0.7);
  color:#fff; padding:3px 8px; border-radius:6px;
  font-size:10px; font-weight:600;
  display:flex; align-items:center; gap:4px;
}

.vid-body {
  padding:10px 12px 12px;
}

.vid-body .cap {
  font-size:13px; font-weight:600;
  line-height:1.35;
  margin-bottom:3px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  color:var(--text);
}

.vid-body .meta {
  font-size:11px; color:var(--text-mute);
  display:flex; align-items:center; gap:6px;
}

.vid-body .meta .sep { width:3px; height:3px; background:#ccc; border-radius:50%; }

/* ─── HALF PAGE PREVIEW ─── */
.half-preview {
  display:none;
  position:fixed; bottom:0; left:0; right:0;
  z-index:2000;
  background:#fff;
  border-top-left-radius:20px;
  border-top-right-radius:20px;
  box-shadow:0 -8px 40px rgba(0,0,0,0.12);
  max-height:55vh;
  overflow-y:auto;
  animation:slideUp 0.4s cubic-bezier(0.16,1,0.3,1);
}

@keyframes slideUp {
  from { transform:translateY(100%); }
  to { transform:translateY(0); }
}

.half-preview.open { display:block; }

.half-handle {
  width:40px; height:4px; border-radius:4px;
  background:#ddd; margin:10px auto 0;
}

.half-header {
  display:flex; align-items:center;
  justify-content:space-between;
  padding:12px 20px 8px;
  border-bottom:1px solid var(--border);
}

.half-header h3 {
  font-size:15px; font-weight:700;
}

.half-header button {
  width:34px; height:34px; border-radius:50%;
  background:#f5f5f5; color:var(--text-soft);
  display:flex; align-items:center; justify-content:center;
  font-size:16px;
}

.half-video {
  width:100%; max-width:500px; margin:0 auto;
  background:#000;
}

.half-video video {
  width:100%; display:block;
  max-height:35vh; background:#000;
}

.half-info {
  padding:12px 20px 24px;
  max-width:500px; margin:0 auto;
}

.half-info .h-title {
  font-size:16px; font-weight:700;
  margin-bottom:4px;
}

.half-info .h-stats {
  font-size:12px; color:var(--text-mute);
  display:flex; gap:14px; margin-bottom:10px;
  flex-wrap:wrap;
}

.half-info .h-stats span { display:flex; align-items:center; gap:4px; }

.half-actions {
  display:flex; gap:8px;
  padding-top:8px;
  border-top:1px solid var(--border);
}

.half-actions .act-btn {
  padding:8px 18px; border-radius:100px;
  background:var(--red); color:#fff;
  font-size:12px; font-weight:600;
  display:flex; align-items:center; gap:5px;
  transition:all 0.3s ease;
}

.half-actions .act-btn:hover { background:var(--red-hover); transform:translateY(-1px); }

.half-actions .act-btn-outline {
  background:transparent; color:var(--text-soft);
  border:1px solid var(--border);
}

.half-actions .act-btn-outline:hover { border-color:#ccc; }

/* ─── OVERLAY ─── */
.overlay {
  display:none;
  position:fixed; inset:0; z-index:1999;
  background:rgba(0,0,0,0.3);
  backdrop-filter:blur(4px);
}

.overlay.open { display:block; animation:fadeIn 0.3s ease; }

/* ─── LOADING SPINNER ─── */
.spin-wrap {
  grid-column:1/-1;
  display:flex; justify-content:center;
  padding:40px 0;
}

.spin {
  width:28px; height:28px;
  border:3px solid #eee;
  border-top-color:var(--red);
  border-radius:50%;
  animation:rotate 0.8s linear infinite;
}

@keyframes rotate { to { transform:rotate(360deg); } }

/* ─── LOAD MORE ─── */
.load-row {
  display:flex; justify-content:center;
  padding:24px 0;
}

.load-btn {
  padding:10px 36px; border-radius:100px;
  background:var(--red); color:#fff;
  font-size:13px; font-weight:600;
  transition:all 0.3s ease;
  display:flex; align-items:center; gap:8px;
}

.load-btn:hover { background:var(--red-hover); transform:translateY(-1px); box-shadow:0 4px 16px var(--red-soft); }

/* ─── TOAST ─── */
.toast {
  position:fixed; bottom:80px; left:50%;
  transform:translateX(-50%);
  background:#111; color:#fff;
  padding:10px 22px; border-radius:100px;
  font-size:13px; font-weight:500;
  box-shadow:0 8px 32px rgba(0,0,0,0.15);
  z-index:9999;
  animation:toastUp 0.35s ease;
  pointer-events:none;
}

@keyframes toastUp {
  from { opacity:0; transform:translateX(-50%) translateY(16px); }
  to { opacity:1; transform:translateX(-50%) translateY(0); }
}
</style>
</head>

<script>
// ─── HELPERS ───
function showToast(msg) {
  const o = document.querySelector('.toast');
  if (o) o.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => {
    t.style.opacity='0';
    t.style.transform='translateX(-50%) translateY(16px)';
    t.style.transition='all 0.35s ease';
    setTimeout(() => t.remove(), 350);
  }, 2800);
}

function fmtNum(n) {
  if (!n) return '0';
  n = Number(n);
  if (n >= 1000000) return (n/1000000).toFixed(1)+'M';
  if (n >= 1000) return (n/1000).toFixed(1)+'K';
  return n.toString();
}

// ─── FILTER ───
function switchFilter(btn, type) {
  document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  showToast('Showing: '+type);
}

// ─── HALF PREVIEW ───
function openHalf(v) {
  document.getElementById('halfPreview').classList.add('open');
  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow='hidden';

  document.getElementById('halfTitle').textContent = v.cap || 'Video';
  document.getElementById('halfCap').textContent = v.cap || 'No caption';
  document.getElementById('halfLikes').textContent = fmtNum(v.likes);
  document.getElementById('halfComments').textContent = fmtNum(v.comments);
  document.getElementById('halfViews').textContent = fmtNum(v.views);
  document.getElementById('halfTime').textContent = v.time || 'recent';

  const vid = document.getElementById('halfVid');
  vid.pause();
  if (v.videoUrl) {
    vid.src = v.videoUrl;
    vid.load();
  } else {
    vid.src = '';
  }

  // Scroll to top of half
  document.getElementById('halfPreview').scrollTop = 0;
}

function closeHalf() {
  document.getElementById('halfPreview').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow='';
  const vid = document.getElementById('halfVid');
  vid.pause();
  vid.src = '';
}

// ─── BUILD GRID ───
function buildGrid(data, append) {

        </div>
      </div>
    `;
    card.addEventListener('click', () => openHalf(v));
    el.appendChild(card);
  });
}

// ─── LOAD MORE ───
function loadMore() {
  if (loadedAll) {
    showToast('No more videos');
    return;
  }
  showToast('Loading more...');
  setTimeout(() => {
    buildGrid(moreVideos, true);
    loadedAll = true;
    showToast('3 more videos loaded');
  }, 600);
}

// ─── INIT ───
document.addEventListener('DOMContentLoaded', () => {
  buildGrid(mockVideos, false);
});
</script>
