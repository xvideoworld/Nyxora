<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nyxora Store</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #e8eaf0;
  --surface: #eef0f5;
  --shadow-light: #ffffff;
  --shadow-dark: #c8cad4;
  --text: #2d2f3a;
  --text-muted: #8a8d9e;
  --red: #e63946;
  --red-dark: #c1121f;
  --neu-raised: 6px 6px 14px var(--shadow-dark), -4px -4px 10px var(--shadow-light);
  --neu-pressed: inset 4px 4px 10px var(--shadow-dark), inset -3px -3px 8px var(--shadow-light);
  --neu-card: 8px 8px 20px var(--shadow-dark), -5px -5px 14px var(--shadow-light);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); font-family: 'Nunito', sans-serif; color: var(--text); min-height: 100vh; }

/* ===== LANGUAGE SCREEN ===== */
#langScreen {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 1000; padding: 30px 20px;
  transition: opacity 0.4s, transform 0.4s;
}
#langScreen.hide { opacity: 0; transform: scale(0.95); pointer-events: none; }

.lang-logo {
  font-size: 36px; font-weight: 900; color: var(--red);
  letter-spacing: -1px; margin-bottom: 8px;
}
.lang-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 40px; }

.lang-card {
  background: var(--surface);
  box-shadow: var(--neu-card);
  border-radius: 24px;
  padding: 28px 20px;
  width: 100%; max-width: 420px;
}
.lang-card h2 { font-size: 18px; font-weight: 800; margin-bottom: 18px; text-align: center; }

.lang-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; max-height: 55vh; overflow-y: auto;
  padding-right: 4px;
}
.lang-grid::-webkit-scrollbar { width: 4px; }
.lang-grid::-webkit-scrollbar-thumb { background: var(--shadow-dark); border-radius: 4px; }

.lang-btn {
  background: var(--surface);
  box-shadow: var(--neu-raised);
  border: none; border-radius: 14px;
  padding: 11px 10px; cursor: pointer;
  font-family: 'Nunito', sans-serif;
  font-size: 13px; font-weight: 700;
  color: var(--text); display: flex;
  align-items: center; gap: 8px;
  transition: all 0.15s;
}
.lang-btn:active { box-shadow: var(--neu-pressed); transform: scale(0.97); }
.lang-btn.selected { box-shadow: var(--neu-pressed); color: var(--red); }
.lang-flag { font-size: 20px; }

.lang-confirm {
  margin-top: 20px; width: 100%;
  background: var(--red); color: #fff;
  border: none; border-radius: 16px;
  padding: 14px; font-family: 'Nunito', sans-serif;
  font-size: 15px; font-weight: 800;
  cursor: pointer; box-shadow: 4px 4px 12px rgba(230,57,70,0.4);
  transition: all 0.2s;
}
.lang-confirm:active { transform: scale(0.97); background: var(--red-dark); }

/* ===== MAIN APP ===== */
#mainApp { display: none; }
#mainApp.show { display: block; }

/* Header */
.header {
  background: var(--surface);
  box-shadow: 0 4px 20px var(--shadow-dark);
  padding: 16px 18px 12px;
  position: sticky; top: 0; z-index: 100;
}
.header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.header-logo { font-size: 22px; font-weight: 900; color: var(--red); letter-spacing: -0.5px; }
.lang-switch-btn {
  background: var(--surface); box-shadow: var(--neu-raised);
  border: none; border-radius: 12px; padding: 7px 12px;
  font-size: 13px; font-weight: 700; cursor: pointer;
  color: var(--text); font-family: 'Nunito', sans-serif;
  transition: all 0.15s;
}
.lang-switch-btn:active { box-shadow: var(--neu-pressed); }

.search-wrap {
  background: var(--surface);
  box-shadow: var(--neu-pressed);
  border-radius: 20px; padding: 10px 16px;
  display: flex; align-items: center; gap: 10px;
}
.search-wrap input {
  border: none; background: transparent; outline: none;
  font-family: 'Nunito', sans-serif; font-size: 14px;
  font-weight: 600; color: var(--text); width: 100%;
}
.search-wrap input::placeholder { color: var(--text-muted); }
.search-icon { color: var(--text-muted); font-size: 16px; }

/* Categories */
.cats {
  display: flex; gap: 9px; overflow-x: auto;
  padding: 14px 18px 4px; scrollbar-width: none;
}
.cats::-webkit-scrollbar { display: none; }
.cat-btn {
  background: var(--surface); box-shadow: var(--neu-raised);
  border: none; border-radius: 20px; padding: 8px 18px;
  font-family: 'Nunito', sans-serif; font-size: 13px;
  font-weight: 700; color: var(--text-muted);
  white-space: nowrap; cursor: pointer; transition: all 0.2s;
}
.cat-btn.active {
  background: var(--red); color: #fff;
  box-shadow: 3px 3px 10px rgba(230,57,70,0.35);
}

/* App count */
.app-count-bar { padding: 10px 18px 6px; font-size: 12px; color: var(--text-muted); font-weight: 700; }

/* App List */
.app-list { padding: 6px 18px 100px; display: flex; flex-direction: column; gap: 12px; }

.app-card {
  background: var(--surface); box-shadow: var(--neu-card);
  border-radius: 20px; padding: 14px 16px;
  display: flex; align-items: center; gap: 14px;
  cursor: pointer; transition: transform 0.15s;
}
.app-card:active { transform: scale(0.98); }

.app-logo {
  width: 58px; height: 58px; border-radius: 14px;
  object-fit: cover; flex-shrink: 0;
  box-shadow: 3px 3px 8px var(--shadow-dark), -2px -2px 6px var(--shadow-light);
}

.app-info { flex: 1; min-width: 0; }
.app-name-text { font-size: 15px; font-weight: 800; color: var(--text); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app-desc-text { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app-meta { display: flex; align-items: center; gap: 8px; }
.app-rating { font-size: 11px; font-weight: 700; color: #f4a261; }
.app-category-tag {
  font-size: 10px; font-weight: 700; background: var(--bg);
  box-shadow: 2px 2px 5px var(--shadow-dark), -1px -1px 4px var(--shadow-light);
  padding: 2px 8px; border-radius: 10px; color: var(--text-muted);
}

.dl-btn {
  background: var(--red); color: #fff;
  border: none; border-radius: 14px;
  padding: 10px 16px; font-family: 'Nunito', sans-serif;
  font-size: 12px; font-weight: 800;
  cursor: pointer; white-space: nowrap; flex-shrink: 0;
  box-shadow: 3px 3px 10px rgba(230,57,70,0.4);
  transition: all 0.15s; text-decoration: none;
  display: flex; align-items: center; gap: 5px;
}
.dl-btn:active { background: var(--red-dark); transform: scale(0.96); }

/* No result */
.no-result { text-align: center; padding: 60px 20px; color: var(--text-muted); font-weight: 700; font-size: 15px; }

/* ===== DETAIL PAGE ===== */
#detailPage {
  position: fixed; inset: 0; background: var(--bg);
  z-index: 200; overflow-y: auto;
  transform: translateX(100%);
  transition: transform 0.35s cubic-bezier(.4,0,.2,1);
}
#detailPage.open { transform: translateX(0); }

.detail-header {
  background: var(--surface);
  box-shadow: 0 4px 16px var(--shadow-dark);
  padding: 16px 18px; display: flex;
  align-items: center; gap: 14px;
  position: sticky; top: 0; z-index: 10;
}
.back-btn {
  background: var(--surface); box-shadow: var(--neu-raised);
  border: none; border-radius: 12px; width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; cursor: pointer; flex-shrink: 0;
  transition: all 0.15s;
}
.back-btn:active { box-shadow: var(--neu-pressed); }
.detail-header-title { font-size: 16px; font-weight: 800; flex: 1; }

.detail-hero { padding: 24px 18px 16px; display: flex; gap: 16px; align-items: flex-start; }
.detail-logo {
  width: 88px; height: 88px; border-radius: 20px;
  object-fit: cover; flex-shrink: 0;
  box-shadow: var(--neu-card);
}
.detail-hero-info { flex: 1; }
.detail-app-name { font-size: 20px; font-weight: 900; margin-bottom: 4px; }
.detail-app-dev { font-size: 13px; color: var(--red); font-weight: 700; margin-bottom: 10px; }

.detail-dl-btn {
  background: var(--red); color: #fff;
  border: none; border-radius: 16px;
  padding: 12px 24px; font-family: 'Nunito', sans-serif;
  font-size: 14px; font-weight: 800;
  cursor: pointer; width: 100%;
  box-shadow: 4px 4px 14px rgba(230,57,70,0.45);
  transition: all 0.2s; text-decoration: none;
  display: block; text-align: center;
}
.detail-dl-btn:active { background: var(--red-dark); transform: scale(0.97); }

/* Stats row */
.stats-row {
  display: flex; gap: 0;
  margin: 0 18px 20px;
  background: var(--surface);
  box-shadow: var(--neu-card);
  border-radius: 18px; overflow: hidden;
}
.stat-item {
  flex: 1; text-align: center; padding: 14px 8px;
  border-right: 1px solid var(--bg);
}
.stat-item:last-child { border-right: none; }
.stat-val { font-size: 16px; font-weight: 900; color: var(--text); }
.stat-lbl { font-size: 10px; color: var(--text-muted); font-weight: 700; margin-top: 2px; }

/* Section */
.detail-section { padding: 0 18px 20px; }
.section-title { font-size: 15px; font-weight: 900; margin-bottom: 12px; }

.desc-box {
  background: var(--surface); box-shadow: var(--neu-card);
  border-radius: 18px; padding: 16px;
  font-size: 13px; line-height: 1.7; color: var(--text);
  font-weight: 600;
}

/* Features */
.features-list { display: flex; flex-direction: column; gap: 8px; }
.feature-item {
  background: var(--surface); box-shadow: var(--neu-raised);
  border-radius: 14px; padding: 12px 14px;
  display: flex; align-items: center; gap: 10px;
  font-size: 13px; font-weight: 700;
}
.feature-icon { font-size: 18px; }

/* Tags */
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag {
  background: var(--surface); box-shadow: var(--neu-raised);
  border-radius: 20px; padding: 6px 14px;
  font-size: 12px; font-weight: 700; color: var(--text-muted);
}

/* Related */
.related-list { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
.related-list::-webkit-scrollbar { display: none; }
.related-card {
  background: var(--surface); box-shadow: var(--neu-raised);
  border-radius: 16px; padding: 12px;
  text-align: center; flex-shrink: 0; width: 110px; cursor: pointer;
  transition: transform 0.15s;
}
.related-card:active { transform: scale(0.96); }
.related-logo { width: 52px; height: 52px; border-radius: 12px; object-fit: cover; margin-bottom: 8px; }
.related-name { font-size: 11px; font-weight: 800; color: var(--text); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.related-dl {
  background: var(--red); color: #fff;
  border: none; border-radius: 10px;
  padding: 5px 10px; font-size: 10px; font-weight: 800;
  cursor: pointer; width: 100%; font-family: 'Nunito', sans-serif;
  box-shadow: 2px 2px 8px rgba(230,57,70,0.35);
}
</style>
</head>
<body>

<!-- LANGUAGE SCREEN -->
<div id="langScreen">
  <div class="lang-logo">⚡ Nyxora</div>
  <div class="lang-subtitle">Choose your language to continue</div>
  <div class="lang-card">
    <h2>🌍 Select Language</h2>
    <div class="lang-grid" id="langGrid"></div>
    <button class="lang-confirm" onclick="confirmLang()">Continue →</button>
  </div>
</div>

<!-- MAIN APP -->
<div id="mainApp">
  <div class="header">
    <div class="header-top">
      <div class="header-logo">⚡ Nyxora</div>
      <button class="lang-switch-btn" onclick="showLangScreen()" id="langSwitchBtn">🌐 EN</button>
    </div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search apps..." onkeyup="filterApps()">
    </div>
  </div>

  <div class="cats">
    <button class="cat-btn active" onclick="filterCat('All')" data-cat="All">All</button>
    <button class="cat-btn" onclick="filterCat('Editors')" data-cat="Editors">Editors</button>
    <button class="cat-btn" onclick="filterCat('Tools')" data-cat="Tools</button>
    <button class="cat-btn" onclick="filterCat('Games')" data-cat="Games">Games</button>
    <button class="cat-btn" onclick="filterCat('Streaming')" data-cat="Streaming">Streaming</button>
  </div>

  <div class="app-count-bar" id="appCountBar">32 apps</div>
  <div class="app-list" id="appList"></div>
  <div class="no-result" id="noResult" style="display:none;">😕 No apps found</div>
</div>

<!-- DETAIL PAGE -->
<div id="detailPage">
  <div class="detail-header">
    <button class="back-btn" onclick="closeDetail()">←</button>
    <div class="detail-header-title" id="detailHeaderTitle">App Detail</div>
  </div>
  <div id="detailContent"></div>
</div>

<script>
// ===== LANGUAGES =====
const languages = [
  {code:'en', flag:'🇬🇧', name:'English'},
  {code:'bn', flag:'🇧🇩', name:'বাংলা'},
  {code:'hi', flag:'🇮🇳', name:'हिन्दी'},
  {code:'ar', flag:'🇸🇦', name:'العربية'},

  {code:'vi', flag:'🇻🇳', name:'Tiếng Việt'},
  {code:'fa', flag:'🇮🇷', name:'فارسی'},
  {code:'sw', flag:'🇹🇿', name:'Swahili'},
  {code:'nl', flag:'🇳🇱', name:'Nederlands'},
  {code:'it', flag:'🇮🇹', name:'Italiano'},
  {code:'pl', flag:'🇵🇱', name:'Polski'},
  {code:'ro', flag:'🇷🇴', name:'Română'},
  {code:'uk', flag:'🇺🇦', name:'Українська'},
  {code:'sv', flag:'🇸🇪', name:'Svenska'},
  {code:'da', flag:'🇩🇰', name:'Dansk'},
  {code:'fi', flag:'🇫🇮', name:'Suomi'},
  {code:'hu', flag:'🇭🇺', name:'Magyar'},
  {code:'cs', flag:'🇨🇿', name:'Čeština'},
  {code:'el', flag:'🇬🇷', name:'Ελληνικά'},
  {code:'he', flag:'🇮🇱', name:'עברית'},
  {code:'ta', flag:'🇱🇰', name:'தமிழ்'},
  {code:'te', flag:'🇮🇳', name:'తెలుగు'},
  {code:'ml', flag:'🇮🇳', name:'മലയാളം'},
  {code:'mr', flag:'🇮🇳', name:'मराठी'},
  {code:'gu', flag:'🇮🇳', name:'ગુજરાતી'},
  {code:'pa', flag:'🇮🇳', name:'ਪੰਜਾਬੀ'},
  {code:'ne', flag:'🇳🇵', name:'नेपाली'},
  {code:'si', flag:'🇱🇰', name:'සිංහල'},
  {code:'my', flag:'🇲🇲', name:'မြန်မာ'},
  {code:'km', flag:'🇰🇭', name:'ខ្មែរ'},
  {code:'lo', flag:'🇱🇦', name:'ລາວ'},
  {code:'az', flag:'🇦🇿', name:'Azərbaycan'},
  {code:'kk', flag:'🇰🇿', name:'Қазақша'},
  {code:'uz', flag:'🇺🇿', name:'Oʻzbekcha'},
  {code:'am', flag:'🇪🇹', name:'አማርኛ'},
  {code:'ha', flag:'🇳🇬', name:'Hausa'},
  {code:'yo', flag:'🇳🇬', name:'Yorùbá'},
  {code:'zu', flag:'🇿🇦', name:'isiZulu'},
];

const t = {
  en: { search:'Search apps...', all:'All', editors:'Editors', tools:'Tools', games:'Games', streaming:'Streaming', download:'Download', apps:'apps', back:'←', description:'About this app', features:'Key Features', tags:'Tags', related:'Related Apps', version:'Version', size:'Size', rating:'Rating', install:'Install', developer:'Nyxora Store', noApps:'No apps found 😕', selectLang:'Select Language', continue:'Continue →', chooseLanguage:'Choose your language to continue' },
  bn: { search:'অ্যাপ খুঁজুন...', all:'সব', editors:'এডিটর', tools:'টুলস', games:'গেমস', streaming:'স্ট্রিমিং', download:'ডাউনলোড', apps:'টি অ্যাপ', back:'←', description:'এই অ্যাপ সম্পর্কে', features:'মূল বৈশিষ্ট্য', tags:'ট্যাগ', related:'সংশ্লিষ্ট অ্যাপ', version:'ভার্সন', size:'সাইজ', rating:'রেটিং', install:'ইনস্টল করুন', developer:'Nyxora Store', noApps:'কোনো অ্যাপ পাওয়া যায়নি 😕', selectLang:'ভাষা বেছে নিন', continue:'চালিয়ে যান →', chooseLanguage:'চালিয়ে যেতে আপনার ভাষা বেছে নিন' },
  hi: { search:'ऐप खोजें...', all:'सभी', editors:'एडिटर', tools:'टूल्स', games:'गेम्स', streaming:'स्ट्रीमिंग', download:'डाउनलोड', apps:'ऐप्स', back:'←', description:'इस ऐप के बारे में', features:'मुख्य विशेषताएं', tags:'टैग', related:'संबंधित ऐप्स', version:'वर्शन', size:'साइज़', rating:'रेटिंग', install:'इंस्टॉल करें', developer:'Nyxora Store', noApps:'कोई ऐप नहीं मिला 😕', selectLang:'भाषा चुनें', continue:'जारी रखें →', chooseLanguage:'जारी रखने के लिए अपनी भाषा चुनें' },
  ar: { search:'ابحث عن التطبيقات...', all:'الكل', editors:'المحررون', tools:'الأدوات', games:'الألعاب', streaming:'البث', download:'تحميل', apps:'تطبيقات', back:'→', description:'عن هذا التطبيق', features:'الميزات الرئيسية', tags:'الوسوم', related:'تطبيقات ذات صلة', version:'الإصدار', size:'الحجم', rating:'التقييم', install:'تثبيت', developer:'Nyxora Store', noApps:'لا توجد تطبيقات 😕', selectLang:'اختر اللغة', continue:'متابعة →', chooseLanguage:'اختر لغتك للمتابعة' },
  es: { search:'Buscar apps...', all:'Todo', editors:'Editores', tools:'Herramientas', games:'Juegos', streaming:'Streaming', download:'Descargar', apps:'apps', back:'←', description:'Sobre esta app', features:'Características', tags:'Etiquetas', related:'Apps relacionadas', version:'Versión', size:'Tamaño', rating:'Calificación', install:'Instalar', developer:'Nyxora Store', noApps:'No se encontraron apps 😕', selectLang:'Seleccionar idioma', continue:'Continuar →', chooseLanguage:'Elige tu idioma para continuar' },
};
// For other languages, fall back to English
const getLang = (code) => t[code] || t['en'];

let selectedLang = 'en';
let currentCat = 'All';

// Build language grid
const langGrid = document.getElementById('langGrid');
languages.forEach(l => {
  const btn = document.createElement('button');
  btn.className = 'lang-btn';
  btn.dataset.code = l.code;
  btn.innerHTML = `<span class="lang-flag">${l.flag}</span>${l.name}`;
  btn.onclick = () => {
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedLang = l.code;
  };
  langGrid.appendChild(btn);
});
// Default select English
langGrid.querySelector('[data-code="en"]').classList.add('selected');

function confirmLang() {
  const ls = document.getElementById('langScreen');
  ls.classList.add('hide');
  setTimeout(() => { ls.style.display = 'none'; }, 400);
  document.getElementById('mainApp').classList.add('show');
  applyLang();
  renderApps();
}

function showLangScreen() {
  const ls = document.getElementById('langScreen');
  ls.style.display = 'flex';
  ls.classList.remove('hide');
}

function applyLang() {
  const l = getLang(selectedLang);
  document.getElementById('searchInput').placeholder = l.search;
  document.getElementById('langSwitchBtn').textContent = '🌐 ' + (languages.find(x=>x.code===selectedLang)?.flag || '🌐');
  document.querySelectorAll('.cat-btn').forEach(b => {
    const cat = b.dataset.cat;
    b.textContent = cat === 'All' ? l.all : cat === 'Editors' ? l.editors : cat === 'Tools' ? l.tools : cat === 'Games' ? l.games : l.streaming;
  });
  filterApps();
}

function renderApps() {
  const l = getLang(selectedLang);
  const list = document.getElementById('appList');
  list.innerHTML = '';
  let count = 0;
  const search = (document.getElementById('searchInput').value||'').toLowerCase();
  apps.forEach(app => {
    if (currentCat !== 'All' && app.cat !== currentCat) return;
    if (search && !app.name.toLowerCase().includes(search)) return;
    count++;
    const card = document.createElement('div');
    card.className = 'app-card';
    card.innerHTML = `
      <img src="${app.img}" alt="${app.name}" class="app-logo" onerror="this.style.background='#ddd'">
      <div class="app-info">
        <div class="app-name-text">${app.name}</div>
        <div class="app-desc-text">${app.desc}</div>
        <div class="app-meta">
          <span class="app-rating">${app.rating}</span>
          <span class="app-category-tag">${app.cat}</span>
        </div>
      </div>
      <button class="dl-btn" onclick="openDetail(${app.id}); event.stopPropagation();">
        ⬇ ${l.download}
      </button>
    `;
    card.onclick = () => openDetail(app.id);
    list.appendChild(card);
  });
  document.getElementById('appCountBar').textContent = count + ' ' + l.apps;
  document.getElementById('noResult').style.display = count === 0 ? 'block' : 'none';
}

function filterApps() { renderApps(); }

function filterCat(cat) {
  currentCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  renderApps();
}

function openDetail(id) {
  const app = apps[id];
  const l = getLang(selectedLang);
  document.getElementById('detailHeaderTitle').textContent = app.name;

  // Related apps (same category, exclude self)
  const related = apps.filter(a => a.cat === app.cat && a.id !== id).slice(0, 8);
  const relatedHTML = related.map(a => `
    <div class="related-card" onclick="openDetail(${a.id})">
      <img src="${a.img}" alt="${a.name}" class="related-logo" onerror="this.style.background='#ddd'">
      <div class="related-name">${a.name}</div>
      <button class="related-dl" onclick="event.stopPropagation(); window.open('${a.apk}')">⬇</button>
    </div>
  `).join('');

  const featuresHTML = app.features.map(f => `
    <div class="feature-item"><span class="feature-icon">✅</span>${f}</div>
  `).join('');

  document.getElementById('detailContent').innerHTML = `
    <div class="detail-hero">
      <img src="${app.img}" alt="${app.name}" class="detail-logo">
      <div class="detail-hero-info">
        <div class="detail-app-name">${app.name}</div>
        <div class="detail-app-dev">${l.developer}</div>
        <a href="${app.apk}" class="detail-dl-btn">⬇ ${l.install}</a>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-item"><div class="stat-val">${app.rating}</div><div class="stat-lbl">${l.rating}</div></div>
      <div class="stat-item"><div class="stat-val">${app.size}</div><div class="stat-lbl">${l.size}</div></div>
      <div class="stat-item"><div class="stat-val">${app.version}</div><div class="stat-lbl">${l.version}</div></div>
      <div class="stat-item"><div class="stat-val">${app.cat}</div><div class="stat-lbl">Category</div></div>
    </div>

    <div class="detail-section">
      <div class="section-title">${l.description}</div>
      <div class="desc-box">${app.about}</div>
    </div>

    <div class="detail-section">
      <div class="section-title">${l.features}</div>
      <div class="features-list">${featuresHTML}</div>
    </div>

    <div class="detail-section">
      <div class="section-title">${l.tags}</div>
      <div class="tags">
        <span class="tag">${app.cat}</span>
        <span class="tag">Android</span>
        <span class="tag">Free</span>
        <span class="tag">Premium</span>
        <span class="tag">APK</span>
      </div>
    </div>

    ${related.length > 0 ? `
    <div class="detail-section">
      <div class="section-title">${l.related}</div>
      <div class="related-list">${relatedHTML}</div>
    </div>` : ''}

    <div style="padding: 0 18px 40px;">
      <a href="${app.apk}" class="detail-dl-btn">⬇ ${l.install} — ${app.name}</a>
    </div>
  `;

  document.getElementById('detailPage').classList.add('open');
  document.getElementById('detailPage').scrollTop = 0;
}

function closeDetail() {
  document.getElementById('detailPage').classList.remove('open');
}
</script>
